spring:
  application:
    name: receipt-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/receipt_tracker
    username: ${DB_USERNAME:receipt_user}
    password: ${DB_PASSWORD:receipt_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    user:
      name: ${API_USER:admin}
      password: ${API_PASSWORD:changeme}

server:
  port: 8080
  cors:
    allowed-origins: http://localhost:4200

# Google Gmail OAuth2
gmail:
  credentials-file: ${GMAIL_CREDENTIALS_FILE:credentials.json}
  tokens-directory: ${GMAIL_TOKENS_DIR:tokens}
  application-name: Receipt Tracker
  sync-cron: "0 0 * * * *"

# Gemini API
gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.8-flash
  max-tokens: 8192

# Alertes prix
pricing:
  alert-threshold-percent: 10.0

logging:
  level:
    com.receipttracker: DEBUG
    org.hibernate.SQL: WARN
  file:
    name: logs/receipt-tracker.log
  logback:
    rollingpolicy:
       max-file-size: 10MB
       max-history: 7
